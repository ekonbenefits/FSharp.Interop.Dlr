name: Build

on:
  push:
    branches: [master]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The AnyUnit tool (anyunit-report, which merges every leg's results
  # into one report). Kept in step with the AnyUnit.* PackageVersions in
  # Directory.Packages.props.
  ANYUNIT_VERSION: '1.2.2'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer reads the version from tags and commit height.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The Tests project runs the repo's own analyzer as part of its build
      # (FSharp.Analyzers.Build; the fsharp-analyzers tool is in the tool
      # manifest), so a dlr { } without the attribute is a build error here
      # - the one deliberate case, Tests/Unreflected.fs, carries an ignore.
      - name: Restore tools
        run: dotnet tool restore

      # Both configurations on purpose: the Release optimizer inlines
      # closure captures the Debug build leaves as fields, and the
      # quotation translation has to cope with either (it didn't, once).
      - name: Build
        run: dotnet build --configuration ${{ matrix.configuration }}

      # The test project is an MTP executable (AnyUnit.TestingPlatform's
      # EnableAnyUnitRunner); each target framework's build is run
      # directly so each writes its own AnyUnit results file. The
      # platform id inside the file is auto-detected (net10-linux-x64,
      # net48-win-x64, ...) with the configuration appended, so the
      # merged report keeps every leg as its own column. A failing test
      # fails the step through the exe's exit code; the results file is
      # still uploaded below so the report shows what failed.
      - name: Test (net10.0)
        shell: bash
        run: |
          mkdir -p results
          dotnet Tests/bin/${{ matrix.configuration }}/net10.0/Tests.dll \
            --report-anyunit-json results/Tests-net10-${{ matrix.configuration }}.json \
            --platform-suffix ${{ matrix.configuration }}

      # The analyzer's own tests type-check small sources through the SDK's
      # testing package (it creates a scratch project and restores it).
      - name: Test (analyzers)
        shell: bash
        run: |
          dotnet Analyzers.Tests/bin/${{ matrix.configuration }}/net10.0/Analyzers.Tests.dll \
            --report-anyunit-json results/Analyzers-net10-${{ matrix.configuration }}.json \
            --platform-suffix ${{ matrix.configuration }}

      - name: Test (net48)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          Tests/bin/${{ matrix.configuration }}/net48/Tests.exe \
            --report-anyunit-json results/Tests-net48-${{ matrix.configuration }}.json \
            --platform-suffix ${{ matrix.configuration }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anyunit-results-${{ matrix.os }}-${{ matrix.configuration }}
          path: results/*.json
          if-no-files-found: warn

  # The translator reads compiler output that no spec pins down: the
  # closure classes F# generates for the Delay lambda (field names, this,
  # FSharpRef cells for mutables, where they nest, generic parameter
  # names) and what the optimizer inlines instead of capturing. Older
  # compilers build the same source so a change in any of that shows up
  # here rather than in a consumer's project. The SDK is pinned with a
  # global.json because the runner image ships several; TargetFrameworks
  # is overridden since those SDKs cannot target net10.0 (and cannot
  # read the .slnx, so the test project is built directly). Both
  # configurations, for the same optimizer reason as above.
  compilers:
    strategy:
      fail-fast: false
      matrix:
        sdk: ['8.0', '9.0']
        configuration: [Debug, Release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '${{ matrix.sdk }}.x'

      - name: Pin the SDK
        shell: bash
        run: |
          printf '{ "sdk": { "version": "%s.0", "rollForward": "latestFeature" }, "test": { "runner": "Microsoft.Testing.Platform" } }' "${{ matrix.sdk }}" > global.json
          dotnet --version

      - name: Build with this compiler
        run: dotnet build Tests/Tests.fsproj --configuration ${{ matrix.configuration }} -p:TargetFrameworks=net${{ matrix.sdk }} -p:RunAnalyzers=false

      # The analyzer as an SDK 8/9 user gets it: the net8.0 build (FSharp.Analyzers.SDK 0.36.0)
      # through the 0.36.0 tool, which is the newest that installs under these SDKs (the repo's
      # manifest pins 0.39.2 for .NET 10, so this one is a global install). Runs the analyzer
      # over the test project, where Unreflected.fs carries the one suppressed DLR001.
      - name: Analyzer on this SDK
        shell: bash
        run: |
          dotnet tool install -g fsharp-analyzers --version 0.36.0
          dotnet build FSharp.Interop.Dlr.Analyzers --configuration ${{ matrix.configuration }} -p:TargetFrameworks=net8.0
          dotnet build Tests/Tests.fsproj --configuration ${{ matrix.configuration }} -p:TargetFrameworks=net${{ matrix.sdk }} --no-incremental \
            -p:RunAnalyzers=true -p:FSharpAnalyzersExeHost= -p:FSharpAnalyzersExe=fsharp-analyzers
          # Prove it loaded: with the suppression removed the build must fail on DLR001.
          sed -i 's|// fsharpanalyzer: ignore-line-next DLR001|// suppression removed for the CI check|' Tests/Unreflected.fs
          if dotnet build Tests/Tests.fsproj --configuration ${{ matrix.configuration }} -p:TargetFrameworks=net${{ matrix.sdk }} --no-incremental \
               -p:RunAnalyzers=true -p:FSharpAnalyzersExeHost= -p:FSharpAnalyzersExe=fsharp-analyzers > analyzer-check.log 2>&1; then
            echo "expected the build to fail on DLR001"; cat analyzer-check.log; exit 1
          fi
          grep -q "error DLR001" analyzer-check.log || { echo "build failed but not on DLR001"; cat analyzer-check.log; exit 1; }
          git checkout Tests/Unreflected.fs

      - name: Test
        shell: bash
        run: |
          mkdir -p results
          dotnet Tests/bin/${{ matrix.configuration }}/net${{ matrix.sdk }}/Tests.dll \
            --report-anyunit-json results/Tests-sdk${{ matrix.sdk }}-${{ matrix.configuration }}.json \
            --platform-suffix sdk${{ matrix.sdk }}-${{ matrix.configuration }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anyunit-results-sdk${{ matrix.sdk }}-${{ matrix.configuration }}
          path: results/*.json
          if-no-files-found: warn

  # The library is JIT-only by design (README) - the C# runtime binder,
  # LambdaExpression.Compile and ReflectedDefinition lookup - and Mono's
  # browser-wasm interpreter is the most different runtime it can be
  # asked to do that on. It found a real bug once (a nested delegate
  # wrapped as an FSharpFunc lost its argument there; see DlrRuntime),
  # which is exactly why it stays in the matrix. Tests.Wasm is the same
  # test sources as a browser-wasm build with the same MTP runner as the
  # other legs: dotnet.js boots the runtime under bun with
  # AnyUnit.TestingPlatform.WasmEntry as the main assembly (no browser,
  # no web server), and wwwroot/runtests.mjs copies the results file out
  # of the in-memory filesystem. Both configurations, same as the other
  # legs: the Release optimizer changes the IL the translator reads, and
  # the interpreter reads that IL differently from the JIT. Tests that
  # genuinely suspend declare [<RequiresCapability(AsyncYield)>] and are
  # reported Ignored here, since the runtime is single-threaded.
  wasm-mtp:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer reads the version from tags and commit height.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: oven-sh/setup-bun@v2

      - name: Build
        run: dotnet build Tests.Wasm --configuration ${{ matrix.configuration }}

      # The harness's exit code is MTP's, so a failing test fails the
      # step; runtests.mjs itself fails if no results file came out of
      # the virtual filesystem. Results are uploaded regardless.
      - name: Test (browser-wasm)
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/results"
          cd Tests.Wasm/bin/${{ matrix.configuration }}/net10.0-browser/wwwroot
          bun runtests.mjs \
            --report-anyunit-json "$GITHUB_WORKSPACE/results/Tests-browser-wasm-${{ matrix.configuration }}.json" \
            --platform-suffix ${{ matrix.configuration }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anyunit-results-browser-wasm-${{ matrix.configuration }}
          path: results/*.json
          if-no-files-found: warn

  # Line/branch coverage of the library, via coverlet's MTP extension (the
  # test exe instruments itself). Restricted to the library assembly:
  # coverlet instruments every assembly it can find sources for, and its
  # rewrite of FSharp.Core 10.1 is not valid IL. Debug AND Release, merged:
  # the translator has paths only the Release optimizer reaches (inlined
  # captures resolved from the reflected body) and paths only Debug does,
  # so either alone under-reports tested code by several points.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: |
          dotnet build Tests/Tests.fsproj --configuration Debug -p:RunAnalyzers=false
          dotnet build Tests/Tests.fsproj --configuration Release -p:RunAnalyzers=false

      - name: Test with coverage
        shell: bash
        run: |
          for c in Debug Release; do
            dotnet Tests/bin/$c/net10.0/Tests.dll \
              --coverlet --coverlet-output-format cobertura \
              --coverlet-include '[FSharp.Interop.Dlr]*' \
              --results-directory coverage/$c
          done

      - name: Merge and summarise
        shell: bash
        run: |
          set -e
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:'coverage/*/coverage.cobertura.*.xml' -targetdir:coverage/merged -reporttypes:'Cobertura;MarkdownSummaryGithub'
          cat coverage/merged/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/merged/Cobertura.xml

  # The package at the version MinVer computed for this commit, as an
  # artifact - so the version a tag would ship is visible on every run
  # before any tag is cut.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: |
          dotnet pack FSharp.Interop.Dlr --configuration Release --output packages
          dotnet pack FSharp.Interop.Dlr.Analyzers --configuration Release --output packages

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: packages/*.nupkg

  # After a green master run, rewrite the README's test and coverage badges
  # from that run's own numbers (the net10 Linux Release leg's test count,
  # the coverage job's merged cobertura), and commit only if a number changed.
  # [skip ci] so the badge commit does not start another run.
  badges:
    needs: [test, compilers, wasm-mtp, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: anyunit-results-ubuntu-latest-Release
          path: results

      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Rewrite badges
        shell: bash
        run: |
          set -e
          tests=$(python3 - <<'PY'
          import json, glob
          d = json.load(open(glob.glob('results/Tests-net10-Release.json')[0]))
          n = sum(1 for a in d['Assemblies'] for f in a['Fixtures'] for t in f['Tests'] for r in t['Results'] if r['Kind'] == 'Success')
          print(n)
          PY
          )
          read line branch < <(python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = ET.parse(glob.glob('coverage/**/Cobertura.xml', recursive=True)[0]).getroot()
          print(round(float(t.get('line-rate')) * 100), round(float(t.get('branch-rate')) * 100))
          PY
          )
          color() { if [ "$1" -ge 90 ]; then echo brightgreen; elif [ "$1" -ge 75 ]; then echo green; else echo yellow; fi; }
          sed -i -E "s|tests-[0-9]+%20passed-[a-z]+|tests-${tests}%20passed-brightgreen|" README.md
          sed -i -E "s|line%20coverage-[0-9]+%25-[a-z]+|line%20coverage-${line}%25-$(color $line)|" README.md
          sed -i -E "s|branch%20coverage-[0-9]+%25-[a-z]+|branch%20coverage-${branch}%25-$(color $branch)|" README.md
          git diff --quiet README.md && { echo "badges unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "README: badges from the latest master run (${tests} tests, ${line}% line, ${branch}% branch) [skip ci]"
          git push

  # Every push to master publishes the package MinVer versioned it as
  # (1.0.0-alpha.0.<height> until a v1.0.0 tag exists, then the tag) to
  # the ekonbenefits GitHub Packages feed, once every test leg is green.
  # GITHUB_TOKEN can push to the repository owner's feed; no secret to
  # rotate. --skip-duplicate makes a re-run of the same commit a no-op,
  # and the feed does not take symbol packages, so only the .nupkg goes.
  publish:
    needs: [test, compilers, wasm-mtp, pack]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: packages

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push packages/*.nupkg
          --source https://nuget.pkg.github.com/ekonbenefits/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
          --no-symbols

  # One report across every OS x configuration x framework: an HTML
  # artifact with the full per-test drill-down, and a Markdown summary
  # on the run's Summary page. if: always() so the report exists
  # precisely when a leg failed and someone wants to look.
  report:
    needs: [test, compilers, wasm-mtp]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # One subdirectory per artifact (no merge-multiple): the file
      # names repeat across OSes and would collide when flattened.
      - name: Download every leg's results
        uses: actions/download-artifact@v4
        with:
          pattern: anyunit-results-*
          path: all-results

      - name: Install anyunit-report
        run: dotnet tool install --global AnyUnit.Report --version "$ANYUNIT_VERSION"

      - name: Merge into one report
        shell: bash
        run: |
          set -e
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p report
          anyunit-report convert -f html -o report/report.html all-results/*/*.json
          anyunit-report convert -f markdown -o report/summary.md all-results/*/*.json
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: report/report.html
